kind = "web"
previewPath = "/"
title = "C. Sethia & Co. Website"
version = "1.0.0"
id = "artifacts/csethia-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22741

[services.development]
run = "pnpm --filter @workspace/csethia-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/csethia-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/csethia-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22741"
BASE_PATH = "/"
